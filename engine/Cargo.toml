[package]
name = "aether_chess"
version = "0.1.0"
edition = "2024"
authors = ["Antigravity <agy@deepmind>"]
description = "High-performance tournament-capable UCI chess engine in Rust"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
